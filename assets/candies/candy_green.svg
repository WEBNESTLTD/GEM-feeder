<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <defs>
    <radialGradient id="gemGrad" cx="36%" cy="32%" r="66%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="30%" stop-color="#4CAF50"/>
      <stop offset="72%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="gemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1D0533" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Ambient ground shadow -->
  <ellipse cx="50" cy="56" rx="43" ry="40" fill="#1B022E" opacity="0.2"/>
  <!-- Main 3D Gem Convex Body -->
  <circle cx="50" cy="50" r="44" fill="url(#gemGrad)" filter="url(#gemShadow)"/>
  <!-- Spherical rim darkening -->
  <circle cx="50" cy="50" r="44" fill="url(#rimShadow)"/>
  <!-- Rim depth stroke -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#0E3B13" stroke-width="1.2" opacity="0.4"/>
  <!-- Soft bottom bounce rim light -->
  <path d="M 23 68 A 40 40 0 0 0 77 68" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.3"/>
  <!-- Primary glossy studio specular reflection -->
  <ellipse cx="35" cy="28" rx="16" ry="8" fill="#ffffff" opacity="0.82" transform="rotate(-28 35 28)"/>
  <!-- Secondary pinpoint sparkle glint -->
  <circle cx="24" cy="22" r="2.6" fill="#ffffff" opacity="0.95"/>
</svg>