<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -90 240 180" width="480" height="360">
  <defs>
    <!-- Foil Cylindrical Pouch Gradient -->
    <linearGradient id="cadburyPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#19022B"/>
      <stop offset="9%" stop-color="#2D084C"/>
      <stop offset="25%" stop-color="#46127A"/>
      <stop offset="44%" stop-color="#641CA0"/>
      <stop offset="52%" stop-color="#7B25B8"/>
      <stop offset="62%" stop-color="#55158B"/>
      <stop offset="82%" stop-color="#320A54"/>
      <stop offset="100%" stop-color="#150125"/>
    </linearGradient>

    <!-- Metallic Plastic Foil Sheen -->
    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="64%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Crimp Seal Gradient -->
    <linearGradient id="crimpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E1780"/>
      <stop offset="50%" stop-color="#2F0850"/>
      <stop offset="100%" stop-color="#19022B"/>
    </linearGradient>

    <!-- 3D Gems Radial Gradients -->
    <!-- Yellow Gem -->
    <radialGradient id="gYellow" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFEB3B"/>
      <stop offset="75%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#C48800"/>
    </radialGradient>

    <!-- Orange Gem -->
    <radialGradient id="gOrange" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="30%" stop-color="#FF9800"/>
      <stop offset="75%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#B23C00"/>
    </radialGradient>

    <!-- Red Gem -->
    <radialGradient id="gRed" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="30%" stop-color="#F44336"/>
      <stop offset="75%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </radialGradient>

    <!-- Green Gem -->
    <radialGradient id="gGreen" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="30%" stop-color="#4CAF50"/>
      <stop offset="75%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>

    <!-- Blue Gem -->
    <radialGradient id="gBlue" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="30%" stop-color="#03A9F4"/>
      <stop offset="75%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#014B78"/>
    </radialGradient>

    <!-- Purple Gem -->
    <radialGradient id="gPurple" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#E1BEE7"/>
      <stop offset="30%" stop-color="#AB47BC"/>
      <stop offset="75%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A0072"/>
    </radialGradient>

    <!-- Pink Gem -->
    <radialGradient id="gPink" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="30%" stop-color="#E91E63"/>
      <stop offset="75%" stop-color="#C2185B"/>
      <stop offset="100%" stop-color="#7B0038"/>
    </radialGradient>

    <!-- Chocolate Interior -->
    <radialGradient id="gChoc" cx="36%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#9C6B58"/>
      <stop offset="40%" stop-color="#6D4333"/>
      <stop offset="80%" stop-color="#4A261A"/>
      <stop offset="100%" stop-color="#2D130A"/>
    </radialGradient>

    <!-- Gold Script Gradient -->
    <linearGradient id="goldScript" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="70%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- 3D Filters -->
    <filter id="gemDrop" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#0C0117" flood-opacity="0.65"/>
    </filter>

    <filter id="pouchShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0A0114" flood-opacity="0.55"/>
    </filter>

    <filter id="bubbleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#120121" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. POUCH BODY & SHADOW                        -->
  <!-- ============================================== -->
  <ellipse cx="0" cy="84" rx="114" ry="12" fill="#0A0115" opacity="0.45" filter="url(#pouchShadow)"/>

  <!-- Pouch Main Body (Open pouch cradle at top) -->
  <path d="M -114 -72 
           C -118 -20 -118 30 -114 78 
           L 114 78 
           C 118 30 118 -20 114 -72 
           L 34 -72 
           C 24 -72 16 -60 0 -60 
           C -16 -60 -24 -72 -34 -72 
           Z" 
        fill="url(#cadburyPurple)" 
        stroke="#160124" 
        stroke-width="1.8"/>

  <path d="M -114 -72 C -118 -20 -118 30 -114 78 L 114 78 C 118 30 118 -20 114 -72 Z" 
        fill="url(#foilSheen)" 
        mix-blend-mode="screen"/>

  <!-- Pouch Open Mouth Interior Cavity -->
  <ellipse cx="0" cy="-64" rx="34" ry="14" fill="#1A022C" stroke="#0E0117" stroke-width="1.5"/>

  <!-- ============================================== -->
  <!-- 2. SERRATED PACKAGING CRIMPS                  -->
  <!-- ============================================== -->
  <path d="M -114 -72 L -110 -77 L -105 -72 L -100 -77 L -95 -72 L -90 -77 L -85 -72 L -80 -77 L -75 -72 L -70 -77 L -65 -72 L -60 -77 L -55 -72 L -50 -77 L -45 -72 L -40 -77 L -34 -72 Z" 
        fill="url(#crimpGrad)" stroke="#300954" stroke-width="1"/>
  <path d="M 34 -72 L 40 -77 L 45 -72 L 50 -77 L 55 -72 L 60 -77 L 65 -72 L 70 -77 L 75 -72 L 80 -77 L 85 -72 L 90 -77 L 95 -72 L 100 -77 L 105 -72 L 110 -77 L 114 -72 Z" 
        fill="url(#crimpGrad)" stroke="#300954" stroke-width="1"/>

  <!-- Bottom Heat Seal Serrated Crimped Edge -->
  <path d="M -114 78 L -110 84 L -105 78 L -100 84 L -95 78 L -90 84 L -85 78 L -80 84 L -75 78 L -70 84 L -65 78 L -60 84 L -55 78 L -50 84 L -45 78 L -40 84 L -35 78 L -30 84 L -25 78 L -20 84 L -15 78 L -10 84 L -5 78 L 0 84 L 5 78 L 10 84 L 15 78 L 20 84 L 25 78 L 30 84 L 35 78 L 40 84 L 45 78 L 50 84 L 55 78 L 60 84 L 65 78 L 70 84 L 75 78 L 80 84 L 85 78 L 90 84 L 95 78 L 100 84 L 105 78 L 110 84 L 114 78 Z" 
        fill="url(#crimpGrad)" stroke="#23053D" stroke-width="1.2"/>

  <!-- Embossed Vertical Crimp Ribs -->
  <g stroke="#ffffff" stroke-width="0.7" opacity="0.16">
    <line x1="-105" y1="78" x2="-105" y2="83"/><line x1="-85" y1="78" x2="-85" y2="83"/><line x1="-65" y1="78" x2="-65" y2="83"/><line x1="-45" y1="78" x2="-45" y2="83"/><line x1="-25" y1="78" x2="-25" y2="83"/><line x1="-5" y1="78" x2="-5" y2="83"/><line x1="15" y1="78" x2="15" y2="83"/><line x1="35" y1="78" x2="35" y2="83"/><line x1="55" y1="78" x2="55" y2="83"/><line x1="75" y1="78" x2="75" y2="83"/><line x1="95" y1="78" x2="95" y2="83"/>
  </g>

  <!-- ============================================== -->
  <!-- 3. OVERFLOWING GEMS FLANKING CRADLE (TOP)      -->
  <!-- ============================================== -->
  <!-- Left Side: Red Gem -->
  <g transform="translate(-78, -66) rotate(-18)" filter="url(#gemDrop)">
    <ellipse rx="15" ry="11.5" fill="url(#gRed)"/>
    <ellipse cx="-4" cy="-4" rx="6.5" ry="2.8" fill="#ffffff" opacity="0.75" transform="rotate(-20 -4 -4)"/>
    <ellipse cx="4.5" cy="3.5" rx="3" ry="1.2" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Left Side: Green Gem -->
  <g transform="translate(-52, -72) rotate(12)" filter="url(#gemDrop)">
    <ellipse rx="15" ry="11.5" fill="url(#gGreen)"/>
    <ellipse cx="-4.5" cy="-4" rx="6.5" ry="2.8" fill="#ffffff" opacity="0.75" transform="rotate(-15 -4.5 -4)"/>
    <ellipse cx="5" cy="3.5" rx="3.5" ry="1.4" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Left Side: ICONIC CRACKED GEM (Showing milk chocolate core!) -->
  <g transform="translate(-32, -64) rotate(-22)" filter="url(#gemDrop)">
    <path d="M -15 0 C -15 -8.5 -8 -13 0 -13 C 8 -13 14 -7 14 0 C 14 3 13 6 11 8 L -1 -2 L -11 8 C -14 5 -15 2 -15 0 Z" fill="url(#gYellow)"/>
    <ellipse cx="-4" cy="-7" rx="6" ry="2.5" fill="#ffffff" opacity="0.8" transform="rotate(-15 -4 -7)"/>
    <ellipse cx="0" cy="3" rx="10.5" ry="7.5" fill="url(#gChoc)"/>
    <path d="M -11 8 C -14 5 -15 2 -15 0" stroke="#FFF59D" stroke-width="1.8" fill="none"/>
  </g>

  <!-- Right Side: Sky Blue Gem -->
  <g transform="translate(36, -68) rotate(16)" filter="url(#gemDrop)">
    <ellipse rx="15" ry="11.5" fill="url(#gBlue)"/>
    <ellipse cx="-4.5" cy="-4" rx="6.5" ry="2.8" fill="#ffffff" opacity="0.8" transform="rotate(-20 -4.5 -4)"/>
    <ellipse cx="5" cy="3.5" rx="3.5" ry="1.4" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Right Side: Bright Orange Gem -->
  <g transform="translate(62, -70) rotate(-14)" filter="url(#gemDrop)">
    <ellipse rx="14.5" ry="11" fill="url(#gOrange)"/>
    <ellipse cx="-4" cy="-3.8" rx="6" ry="2.6" fill="#ffffff" opacity="0.75" transform="rotate(-15 -4 -3.8)"/>
    <ellipse cx="4.5" cy="3.2" rx="3" ry="1.2" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Right Side: Purple Gem -->
  <g transform="translate(86, -62) rotate(24)" filter="url(#gemDrop)">
    <ellipse rx="13.5" ry="10" fill="url(#gPurple)"/>
    <ellipse cx="-3.5" cy="-3.5" rx="5.5" ry="2.4" fill="#ffffff" opacity="0.7" transform="rotate(-15 -3.5 -3.5)"/>
  </g>

  <!-- ============================================== -->
  <!-- 4. SCATTERED GEMS ON POUCH BODY                -->
  <!-- ============================================== -->
  <!-- Left Side Gem: Pink -->
  <g transform="translate(-94, -36) rotate(32)" filter="url(#gemDrop)">
    <ellipse rx="13" ry="9.5" fill="url(#gPink)"/>
    <ellipse cx="-3.5" cy="-3.2" rx="5" ry="2" fill="#ffffff" opacity="0.75" transform="rotate(-20 -3.5 -3.2)"/>
  </g>

  <!-- Left Side Gem: Orange (Tilted) -->
  <g transform="translate(-88, 2) rotate(-26)" filter="url(#gemDrop)">
    <ellipse rx="14" ry="10.5" fill="url(#gOrange)"/>
    <ellipse cx="-4" cy="-3.5" rx="6" ry="2.4" fill="#ffffff" opacity="0.75" transform="rotate(-20 -4 -3.5)"/>
  </g>

  <!-- Bottom Left Gem: Yellow -->
  <g transform="translate(-84, 42) rotate(18)" filter="url(#gemDrop)">
    <ellipse rx="13.5" ry="10" fill="url(#gYellow)"/>
    <ellipse cx="-3.8" cy="-3.2" rx="5.5" ry="2.2" fill="#ffffff" opacity="0.8" transform="rotate(-15 -3.8 -3.2)"/>
  </g>

  <!-- Bottom Left-Center Gem: Red -->
  <g transform="translate(-48, 60) rotate(-14)" filter="url(#gemDrop)">
    <ellipse rx="13.5" ry="10" fill="url(#gRed)"/>
    <ellipse cx="-3.6" cy="-3.2" rx="5.5" ry="2.2" fill="#ffffff" opacity="0.75" transform="rotate(-15 -3.6 -3.2)"/>
  </g>

  <!-- Bottom Center Gem: Green -->
  <g transform="translate(-12, 63) rotate(20)" filter="url(#gemDrop)">
    <ellipse rx="14" ry="10.5" fill="url(#gGreen)"/>
    <ellipse cx="-3.8" cy="-3.5" rx="5.8" ry="2.4" fill="#ffffff" opacity="0.75" transform="rotate(-20 -3.8 -3.5)"/>
  </g>

  <!-- Bottom Center-Right Gem: Blue -->
  <g transform="translate(24, 61) rotate(-18)" filter="url(#gemDrop)">
    <ellipse rx="13.5" ry="10" fill="url(#gBlue)"/>
    <ellipse cx="-3.6" cy="-3.2" rx="5.5" ry="2.2" fill="#ffffff" opacity="0.8" transform="rotate(-15 -3.6 -3.2)"/>
  </g>

  <!-- Right Mid Gem: Green (Right of GEMS) -->
  <g transform="translate(90, 2) rotate(28)" filter="url(#gemDrop)">
    <ellipse rx="14" ry="10.5" fill="url(#gGreen)"/>
    <ellipse cx="-3.8" cy="-3.5" rx="5.8" ry="2.4" fill="#ffffff" opacity="0.75" transform="rotate(-15 -3.8 -3.5)"/>
  </g>

  <!-- Right Side: SECOND ICONIC CRACKED GEM -->
  <g transform="translate(56, 38) rotate(34)" filter="url(#gemDrop)">
    <path d="M -13 0 C -13 -7 -7 -11 0 -11 C 7 -11 12 -6 12 0 C 12 3 11 5 9 7 L -1 -1 L -9 7 C -12 4 -13 2 -13 0 Z" fill="url(#gPink)"/>
    <ellipse cx="-3" cy="-6" rx="5" ry="2.2" fill="#ffffff" opacity="0.8" transform="rotate(-15 -3 -6)"/>
    <ellipse cx="0" cy="2.5" rx="8.5" ry="6" fill="url(#gChoc)"/>
    <path d="M -9 7 C -12 4 -13 2 -13 0" stroke="#FF80AB" stroke-width="1.6" fill="none"/>
  </g>

  <!-- ============================================== -->
  <!-- 5. ICONIC CADBURY SCRIPT LOGO (CENTER)         -->
  <!-- ============================================== -->
  <g transform="translate(0, -32)">
    <!-- Shadow -->
    <text x="0" y="2" 
          text-anchor="middle" 
          font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', cursive, sans-serif" 
          font-size="26px" 
          font-weight="bold" 
          font-style="italic" 
          fill="#130122" 
          opacity="0.85">Cadbury</text>
    <!-- Foreground Rich Gold -->
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Brush Script MT', 'Dancing Script', 'Pacifico', 'Caveat', cursive, sans-serif" 
          font-size="26px" 
          font-weight="bold" 
          font-style="italic" 
          fill="url(#goldScript)" 
          stroke="#4D2A00" 
          stroke-width="0.7" 
          letter-spacing="0.5">Cadbury</text>
    <!-- Underline Flourish -->
    <path d="M -30 6 C -10 9 16 9 42 6 C 54 4 64 2 70 -1" fill="none" stroke="url(#goldScript)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- ============================================== -->
  <!-- 6. PUFFY 3D BUBBLE LETTERS: G E M S            -->
  <!-- ============================================== -->
  <g transform="translate(0, 10)">
    <!-- 3D Extruded Deep Purple Drop Shadow / Bevel Base (Y + 4) -->
    <g fill="#160128" filter="url(#bubbleDrop)">
      <!-- G -->
      <path d="M -72 12 C -72 17 -64 20 -54 20 C -42 20 -38 13 -38 7 L -38 0 L -52 0 L -52 6 L -46 6 L -46 8 C -46 11 -50 13 -54 13 C -60 13 -64 10 -64 2 C -64 -6 -60 -9 -54 -9 C -49 -9 -46 -7 -44 -4 L -38 -8 C -42 -13 -47 -16 -54 -16 C -65 -16 -72 -10 -72 2 Z" transform="translate(0, 4)"/>
      <!-- E -->
      <path d="M -34 12 C -34 17 -29 20 -21 20 L -7 20 L -7 13 L -19 13 L -19 5 L -9 5 L -9 -1 L -19 -1 L -19 -9 L -7 -9 L -7 -16 L -21 -16 C -29 -16 -34 -13 -34 -8 Z" transform="translate(0, 4)"/>
      <!-- M -->
      <path d="M -3 -16 L 7 -16 L 14 2 L 21 -16 L 31 -16 L 31 20 L 22 20 L 22 2 L 16 14 L 12 14 L 6 2 L 6 20 L -3 20 Z" transform="translate(0, 4)"/>
      <!-- S -->
      <path d="M 36 8 C 36 15 43 20 54 20 C 65 20 72 15 72 9 C 72 3 67 0 59 -2 C 51 -4 48 -5 48 -8 C 48 -10 51 -12 55 -12 C 60 -12 63 -10 64 -7 L 70 -11 C 68 -14 62 -16 55 -16 C 44 -16 39 -12 39 -6 C 39 -1 44 2 52 4 C 60 6 63 7 63 10 C 63 12 59 14 54 14 C 48 14 45 11 44 8 Z" transform="translate(0, 4)"/>
    </g>

    <!-- White Plump 3D Bubble Letter Faces -->
    <!-- G -->
    <path d="M -72 12 C -72 17 -64 20 -54 20 C -42 20 -38 13 -38 7 L -38 0 L -52 0 L -52 6 L -46 6 L -46 8 C -46 11 -50 13 -54 13 C -60 13 -64 10 -64 2 C -64 -6 -60 -9 -54 -9 C -49 -9 -46 -7 -44 -4 L -38 -8 C -42 -13 -47 -16 -54 -16 C -65 -16 -72 -10 -72 2 Z" fill="#FFFFFF" stroke="#E2D4F5" stroke-width="1"/>
    <path d="M -68 -2 C -67 -9 -62 -13 -54 -13 C -49 -13 -46 -11 -44 -8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- E -->
    <path d="M -34 12 C -34 17 -29 20 -21 20 L -7 20 L -7 13 L -19 13 L -19 5 L -9 5 L -9 -1 L -19 -1 L -19 -9 L -7 -9 L -7 -16 L -21 -16 C -29 -16 -34 -13 -34 -8 Z" fill="#FFFFFF" stroke="#E2D4F5" stroke-width="1"/>
    <path d="M -31 -12 L -11 -12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- M -->
    <path d="M -3 -16 L 7 -16 L 14 2 L 21 -16 L 31 -16 L 31 20 L 22 20 L 22 2 L 16 14 L 12 14 L 6 2 L 6 20 L -3 20 Z" fill="#FFFFFF" stroke="#E2D4F5" stroke-width="1"/>
    <path d="M 0 -12 L 5 -12 M 23 -12 L 28 -12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- S -->
    <path d="M 36 8 C 36 15 43 20 54 20 C 65 20 72 15 72 9 C 72 3 67 0 59 -2 C 51 -4 48 -5 48 -8 C 48 -10 51 -12 55 -12 C 60 -12 63 -10 64 -7 L 70 -11 C 68 -14 62 -16 55 -16 C 44 -16 39 -12 39 -6 C 39 -1 44 2 52 4 C 60 6 63 7 63 10 C 63 12 59 14 54 14 C 48 14 45 11 44 8 Z" fill="#FFFFFF" stroke="#E2D4F5" stroke-width="1"/>
    <path d="M 41 -9 C 44 -13 49 -14 55 -14 C 61 -14 65 -12 67 -9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ============================================== -->
  <!-- 7. MORE CHOCOLATY! BANNER (CURVED)             -->
  <!-- ============================================== -->
  <g transform="translate(0, 42)">
    <!-- Drop Shadow Text -->
    <text x="0" y="2" 
          text-anchor="middle" 
          font-family="'Fredoka', 'Arial Black', sans-serif" 
          font-size="12px" 
          font-weight="900" 
          fill="#160124" 
          letter-spacing="1.2">MORE CHOCOLATY!</text>
    <!-- Crisp White Foreground Text -->
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Fredoka', 'Arial Black', sans-serif" 
          font-size="12px" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="1.2">MORE CHOCOLATY!</text>
  </g>

  <!-- ============================================== -->
  <!-- 8. NUTRITIONAL GDA BADGE (BOTTOM RIGHT)        -->
  <!-- ============================================== -->
  <g transform="translate(78, 60)">
    <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#FFFFFF" stroke="#D1C2E6" stroke-width="0.8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="5px" font-weight="bold" fill="#5E35B1">Per Pack</text>
    <text x="0" y="-1" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="7px" font-weight="900" fill="#2E0854">100%</text>
    <text x="0" y="7" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="6px" font-weight="900" fill="#E91E63">FUN</text>
  </g>

</svg>